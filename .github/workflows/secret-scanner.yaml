name: Secret Scanner

on:
  workflow_call:

jobs:
  trufflehog-scanner:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # On a force-push, github.event.before points at a commit that was replaced.
      # TruffleHog scans a clone of the checkout, which has the branches but not a
      # replaced commit, so it fails with "object not found". Fetching the commit
      # by its SHA can work (GitHub keeps it for a while), and that does not help:
      # it then exists in the checkout, but on no branch.
      # So the base commit is used only when it is an ancestor of the new head.
      # Otherwise, scan the whole branch up to HEAD.
      - name: Check push base commit
        id: base-check
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          zeros=0000000000000000000000000000000000000000
          if [ "$BEFORE" = "$zeros" ] || [ "$AFTER" = "$zeros" ]; then
            exit 0
          fi
          if ! git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
            echo "::warning::Base commit $BEFORE is not an ancestor of $AFTER (force-push?). Scanning full branch history up to $AFTER."
            echo "head=$AFTER" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          # Empty unless the base commit cannot be used; empty keeps the action's default push logic.
          head: ${{ steps.base-check.outputs.head }}
          extra_args: --only-verified --fail-on-scan-errors

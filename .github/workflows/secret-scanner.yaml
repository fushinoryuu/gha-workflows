name: Secret Scanner

on:
  workflow_call:

jobs:
  trufflehog-scanner:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # On a force-push, github.event.before is a commit that was replaced, and it
      # is on no branch in the checkout. The action passes it to TruffleHog as the
      # start of the scan, which fails with "object not found". So a force-push
      # scans the whole branch up to the new head, and every other event keeps the
      # action's default logic.
      - name: Scan for secrets (force-push)
        if: github.event_name == 'push' && github.event.forced && !github.event.deleted
        uses: trufflesecurity/trufflehog@main
        with:
          head: ${{ github.event.after }}
          extra_args: --only-verified --fail-on-scan-errors

      - name: Scan for secrets
        if: github.event_name != 'push' || !github.event.forced || github.event.deleted
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --fail-on-scan-errors

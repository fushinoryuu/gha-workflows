name: 'Code Coverage PR Comment'
description: 'Comment on a pull request with code coverage information'

inputs:
  coverage-report-path:
    description: Path to the code coverage report file
    required: true
  test-framework:
    description: Test framework used to generate the coverage report (e.g., vitest, pytest, jest)
    required: true
    default: vitest

runs:
  using: 'composite'
  steps:
    - name: Check test framework
      shell: pwsh
      env:
        TEST_FRAMEWORK: ${{ inputs.test-framework }}
      run: |
        if ($env:TEST_FRAMEWORK -notin @('vitest', 'pytest', 'jest')) {
          throw "Unsupported test framework: $env:TEST_FRAMEWORK. Supported frameworks are: vitest, pytest, jest."
        }

    # Converts the pytest (coverage.py) report into the same shape that vitest produces,
    # so the next step can read either one.
    - name: Convert Pytest file
      if: ${{ inputs.test-framework == 'pytest' }}
      shell: pwsh
      run: ${{ github.action_path }}/convert-pytest-coverage.ps1 -CoverageReportPath "${{ inputs.coverage-report-path }}" -OutputPath "${{ runner.temp }}/coverage-summary.json"

    - name: Create coverage comment - Jest/Vitest
      if: ${{ inputs.test-framework == 'jest' || inputs.test-framework == 'vitest' }}
      shell: pwsh
      run: ${{ github.action_path }}/create-coverage-comment-jest-vitest.ps1 -CoverageReportPath ${{ inputs.coverage-report-path }}

    - name: Post comment on PR
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const comment = fs.readFileSync('${{ github.action_path }}/coverage-comment.md', 'utf8');

          // The template starts with this hidden marker, which is how we find our
          // comment from a previous run and update it instead of adding a new one.
          const marker = '<!-- code-coverage-report -->';
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number
          });
          const existing = comments.find(c => c.body?.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body: comment
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: comment
            });
          }

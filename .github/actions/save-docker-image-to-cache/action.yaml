name: 'Save Docker Image to Cache'
description: 'Save image to repo cache'

inputs:
  cache-key:
    description: 'Cache key for the image'
    required: true
  full-image-name:
    description: 'Full image name including tag'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Check if image exists in cache
      id: check-docker-cache
      uses: actions/cache@v4
      with:
        path: ci/cache/docker
        key: ${{ inputs.cache-key }}

    - name: Update image cache on cache miss
      if: steps.check-docker-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        docker pull ${{ inputs.full-image-name }}
        mkdir -p ci/cache/docker
        docker image save ${{ inputs.full-image-name }} --output ./ci/cache/docker/${{ inputs.cache-key }}.tar

    - name: Use image from cache on cache hit
      if: steps.check-docker-cache.outputs.cache-hit == 'true'
      shell: pwsh
      run: docker image load --input ./ci/cache/docker/${{ inputs.cache-key }}.tar

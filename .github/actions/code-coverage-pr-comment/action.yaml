name: 'Code Coverage PR Comment'
description: 'Comment on a pull request with code coverage information'

inputs:
  coverage-report-path:
    description: 'Path to the code coverage report file'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Create coverage comment
      shell: pwsh
      run: ${{ github.action_path }}/create-coverage-comment.ps1 -CoverageReportPath ${{ inputs.coverage-report-path }}

    - name: Post comment on PR
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const comment = fs.readFileSync('${{ github.action_path }}/coverage-comment.md', 'utf8');

          // The template starts with this hidden marker, which is how we find our
          // comment from a previous run and update it instead of adding a new one.
          const marker = '<!-- code-coverage-report -->';
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number
          });
          const existing = comments.find(c => c.body?.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body: comment
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: comment
            });
          }

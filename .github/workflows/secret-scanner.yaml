name: Secret Scanner

on:
  workflow_call:

jobs:
  trufflehog-scanner:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --fail-on-scan-errors

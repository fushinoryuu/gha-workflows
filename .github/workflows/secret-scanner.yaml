name: Secret Scanner

on:
  workflow_call:

jobs:
  trufflehog-scanner:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # On a force-push, github.event.before points at a commit that was replaced
      # and is not in the clone. TruffleHog would fail with "object not found".
      # Try to fetch it; if it is still missing, scan the whole branch up to HEAD.
      - name: Check push base commit
        id: base-check
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          zeros=0000000000000000000000000000000000000000
          if [ "$BEFORE" = "$zeros" ] || [ "$AFTER" = "$zeros" ]; then
            exit 0
          fi
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BEFORE" || true
          fi
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::warning::Base commit $BEFORE is not available (force-push?). Scanning full branch history up to $AFTER."
            echo "head=$AFTER" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          # Empty unless the base commit is missing; empty keeps the action's default push logic.
          head: ${{ steps.base-check.outputs.head }}
          extra_args: --only-verified --fail-on-scan-errors
